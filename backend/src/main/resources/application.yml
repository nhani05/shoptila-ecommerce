spring:
  application:
    name: shoptila-backend
  # Dev convenience: nạp `.env` ở repo root (chạy `./mvnw` từ backend/) hoặc thư mục hiện tại.
  # Biến môi trường thật vẫn có độ ưu tiên cao hơn file này; file có thể vắng mặt (optional).
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
