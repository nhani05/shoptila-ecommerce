services:
  postgres:
    image: postgres:16-alpine
    container_name: shoptila-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-shoptila}
      POSTGRES_USER: ${DB_USER:-shoptila}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shoptila}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-shoptila} -d ${DB_NAME:-shoptila}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
